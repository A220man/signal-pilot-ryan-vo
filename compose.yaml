services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: signal-pilot-backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - signal-pilot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: signal-pilot-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Keycloak is included for future OIDC authentication support.
  # Auth is a planned milestone — the application currently runs in demo mode.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: signal-pilot-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    profiles: ["auth"]
    restart: unless-stopped

volumes:
  signal-pilot-data:
  keycloak-data: